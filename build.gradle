plugins {
    alias libs.plugins.fabric.loom
    id 'maven-publish'
    alias libs.plugins.shadow apply false
    alias libs.plugins.lombok
    alias libs.plugins.spotless
    alias libs.plugins.modmuss50.publish
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import me.modmuss50.mpp.ReleaseType
import net.fabricmc.loom.api.RemapConfigurationSettings

def local = !System.getenv().containsKey("GITHUB_RUN_NUMBER");

version = "${project.mod_version}-${project.minecraft_version}-${local ? 'SNAPSHOT' : "build.${System.getenv("GITHUB_RUN_NUMBER")}"}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven {
        url = 'https://maven.zenfyr.dev/'
        content { includeGroup('dev.zenfyr') }
    }
    maven { url 'https://jitpack.io' }
}

configurations.register("shade") {
    transitive = false
}

tasks.register('dependenciesJar', ShadowJar) {
    configurations = [project.configurations.shade]
    archiveClassifier = "dependencies"

    exclude("META-INF/**")
}

tasks.register('fullDependenciesJar', ShadowJar) {
    dependsOn(dependenciesJar)
    mustRunAfter(jar)
    archiveClassifier = "full-dependencies"

    from(tasks.jar)
    from(dependenciesJar)

    var pck = "dev.zenfyr.commander.impl.lib."

    mergeServiceFiles()
    relocate("com.ezylang.evalex", pck + "com.ezylang.evalex")
    relocate("net.fabricmc.mappingio", pck + "net.fabricmc.mappingio")
}

remapJar {
    dependsOn(fullDependenciesJar)
    getInputFile().set(fullDependenciesJar.archiveFile.get())
}
tasks.jar.archiveClassifier = "slim"

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    addRemapConfiguration("testmodRemapImplementation", (RemapConfigurationSettings configuration) -> {
        configuration.getTargetConfigurationName().convention("testmodImplementation")
        configuration.getSourceSet().convention(sourceSets.testmod)
        configuration.getOnCompileClasspath().convention(true)
        configuration.getOnRuntimeClasspath().convention(true)
        configuration.getPublishingMode().convention(RemapConfigurationSettings.PublishingMode.NONE)
    })
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation libs.fabric.api
    modImplementation libs.pulsar

    [libs.evalx, libs.mapping.io].each {
        compileOnly it
        localRuntime it
        shade it
    }

    testmodImplementation sourceSets.main.output
    testmodImplementation libs.assertj.core
}

spotless {
    java {
        removeUnusedImports()
        palantirJavaFormat('2.91.0').style("GOOGLE")
        trimTrailingWhitespace()
        formatAnnotations()
    }
}

def cleanMcVersion = project.minecraft_version.replace('.', '_')

loom {
    accessWidenerPath = file("src/main/resources/commander.classtweaker")

    runs {
        testmod {
            server()
            name = "Testmod"
            source sourceSets.testmod
            runDir "run/%s/testmod_server".formatted(cleanMcVersion)
        }
        testmodClient {
            client()
            name = "Testmod Client"
            source sourceSets.testmod
            runDir "run/%s/testmod_client".formatted(cleanMcVersion)
        }
        gametest {
            inherit testmod

            name "Game Test"

            // Enable the gametest runner
            vmArg "-Dfabric-api.gametest"
            runDir "build/gametest/%s".formatted(cleanMcVersion)
        }
    }

    //https://gist.github.com/maityyy/3dbcd558d58a6412c3a2a38c72706e8e
    afterEvaluate {
        loom.runs.configureEach {
            vmArgs("-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition")

            vmArg "-javaagent:${configurations.compileClasspath.find { it.name.contains("sponge-mixin") }}"
            property("mixin.debug.export", "true")
        }
    }

    mods.register(project.archives_base_name) {
        sourceSet project.sourceSets.main
    }

    mods.register(project.archives_base_name + "-testmod") {
        sourceSet project.sourceSets.testmod
    }
}

processResources {
    def map = [
            "version"          : project.version,
            "minecraft_version": project.minecraft_version,
            "loader_version"   : libs.fabric.loader.get().version,
            "fabric_version"   : libs.fabric.api.get().version,
            "pulsar_version"   : libs.pulsar.get().version
    ]
    inputs.properties(map)
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand map
    }
}

def targetJavaVersion = 17
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    from("LICENSE_mapping-io")
    from("LICENSE_EvalEx")
}

sourcesJar {
    exclude {
        sourceSets.main.allSource.contains it.file
    }
    from delombok
}

def s3Endpoint = project.findProperty("s3AccessKeyId") ?: System.getenv("S3_ENDPOINT")
if (s3Endpoint) {
    System.setProperty("org.gradle.s3.endpoint", s3Endpoint)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    if (s3Endpoint) {
        repositories {
            maven {
                name = "MavenS3"
                url = "s3://maven"

                credentials(AwsCredentials) {
                    accessKey = project.findProperty("s3AccessKeyId") ?: System.getenv("S3_ACCESS_KEY_ID")
                    secretKey = project.findProperty("s3SecretAccessKey") ?: System.getenv("S3_SECRET_ACCESS_KEY")
                }
            }
        }
    }
}

publishMods {
    file = remapJar.archiveFile
    additionalFiles.from(remapSourcesJar.archiveFile)

    changelog = file("CHANGELOG.md").text
    type = ReleaseType.valueOf(providers.environmentVariable("VERSION_TYPE").getOrElse("BETA"))
    modLoaders.add("fabric")

    displayName = "${project.mod_version} (${project.minecraft_version})"

    modrinth {
        projectId = "86bUtxWv"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add("${project.minecraft_version}")

        requires("fabric-api")
        embeds("dark-matter")
    }
    curseforge {
        projectId = "1009687"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add("${project.minecraft_version}")

        requires("fabric-api")
        embeds("dark-matter")
    }
    github {
        repository = "constellation-mc/commander"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = providers.environmentVariable("GITHUB_SHA").getOrElse("${project.minecraft_version}-fabric")

        type = STABLE
    }

    dryRun = local
}
